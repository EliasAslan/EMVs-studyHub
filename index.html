<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMVS Study Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

<div class="app">
  <header class="mobile-header">
    <span class="mobile-brand">EMVS</span>
    <button class="menu-btn" id="menuBtn" aria-label="Menü öffnen">☰</button>
  </header>
  <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Hauptnavigation">
    <div class="brand">
      <span class="brand-mark">EMVS</span>
      <span class="brand-sub">study hub</span>
    </div>

    <div class="toc-label">Allgemein</div>
    <nav class="toc" id="nav-global" role="list">
      <div class="toc-item" data-view="today" role="listitem"><span class="toc-num">01</span> Heute</div>
      <div class="toc-item" data-view="weak-spots" role="listitem"><span class="toc-num">02</span> Schwachstellen</div>
      <div class="toc-item" data-view="captures" role="listitem"><span class="toc-num">03</span> Erfassen</div>
      <div class="toc-item" data-view="exams-global" role="listitem"><span class="toc-num">04</span> Prüfungen</div>
      <div class="toc-item" data-view="weekly-review" role="listitem"><span class="toc-num">05</span> Review</div>
      <div class="toc-item" data-view="tools" role="listitem"><span class="toc-num">06</span> Werkzeuge</div>
      <div class="toc-item" data-view="settings" role="listitem"><span class="toc-num">07</span> Einstellungen</div>
    </nav>
    <div class="sidebar-overflow" id="sidebar-overflow" hidden>
      <button class="overflow-toggle" type="button" aria-label="Weitere allgemeine Ansichten">Mehr <span>▾</span></button>
      <div class="overflow-menu" id="overflow-menu"></div>
    </div>

    <div class="toc-label">Module</div>
    <div id="nav-modules"></div>

    <div class="sidebar-footer">
      <button class="cmd-trigger" id="cmd-trigger" aria-label="Befehlspalette öffnen">
        <span>Befehl ausführen</span>
        <kbd id="kbd-hint">⌘K</kbd>
      </button>
    </div>
  </aside>

  <main class="main" id="main" role="main">
    <div class="page" id="view-root"></div>
  </main>
</div>

<!-- Modal Overlay -->
<div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h3 class="modal-title" id="modal-title">Titel</h3>
      <button class="modal-close" id="modal-close" aria-label="Schließen">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- Command Palette -->
<div class="palette-overlay" id="palette-overlay" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="palette">
    <input class="palette-input" id="palette-input" placeholder="Springe zu… oder führe aus…" autocomplete="off" aria-label="Befehlsuche">
    <div class="palette-list" id="palette-list" role="listbox"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toast-message"></span>
  <button class="btn ghost" id="toast-undo" style="display:none">Rückgängig</button>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
