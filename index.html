<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="EMVS Study Hub — Module, Lernziele, Sitzungen und Prüfungen lokal und fokussiert verwalten.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f3ea">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16120c">
  <title>EMVS Study Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
<a class="skip-link" href="#main">Zum Inhalt springen</a>

<header id="topbar" hidden>
  <div class="topbar-brand"><span class="brand-mark">EMVS</span></div>
  <nav class="topbar-nav" aria-label="Hauptnavigation">
    <button data-route="today" aria-current="false"><span aria-hidden="true">◉</span><span>Heute</span></button>
    <button data-route="overview" aria-current="false"><span aria-hidden="true">▦</span><span>Module</span></button>
    <button data-route="weak-spots" aria-current="false"><span aria-hidden="true">△</span><span>Schwach</span><span class="tb-badge" data-badge="weak" role="status" hidden></span></button>
    <button data-route="exams-global" aria-current="false"><span aria-hidden="true">◷</span><span>Prüfungen</span><span class="tb-badge" data-badge="exam" role="status" hidden></span></button>
  </nav>
  <div class="topbar-actions">
    <button id="topbarMod" aria-label="Aktuelles Modul öffnen">Module</button>
    <button id="topbarCapture" aria-label="Schnell erfassen: Frage, Fehler oder Gedanke festhalten" title="Schnell erfassen">+</button>
    <button id="topbarMore" aria-label="Weitere Bereiche öffnen" aria-expanded="false" aria-controls="more-sheet">⋯</button>
  </div>
</header>

<div class="app">
  <header class="mobile-header">
    <span class="mobile-brand">EMVS</span>
    <div class="mobile-actions">
      <button class="icon-btn" id="searchBtn" aria-label="Suchen und Befehle (Strg+K)">⌕</button>
      <button class="icon-btn" id="moreBtn" aria-label="Weitere Bereiche öffnen" aria-expanded="false" aria-controls="more-sheet">⋯</button>
      <button class="menu-btn" id="menuBtn" aria-label="Menü öffnen" aria-expanded="false" aria-controls="sidebar">☰</button>
    </div>
  </header>
  <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Hauptnavigation">
    <div class="brand">
      <span class="brand-mark">EMVS</span>
      <span class="brand-sub">study hub</span>
    </div>
    <button class="rail-toggle" id="railToggle" aria-expanded="false" aria-label="Seitenleiste erweitern" title="Seitenleiste erweitern"><span class="rail-toggle-ico" aria-hidden="true">»</span><span class="toc-lb">Leiste</span></button>

    <div class="toc-label">Menü</div>
    <nav class="toc" id="nav-global" role="list">
      <div class="toc-item" data-view="today" role="listitem" title="Heute — Tagesfokus"><span class="toc-ico" aria-hidden="true">◉</span><span class="toc-num">01</span> <span class="toc-lb">Heute</span></div>
      <div class="toc-item" data-view="overview" role="listitem" title="Module — alle Module im Überblick"><span class="toc-ico" aria-hidden="true">▦</span><span class="toc-num">02</span> <span class="toc-lb">Module</span></div>
      <div class="rail-div" aria-hidden="true"></div>
      <button class="rail-fab" id="railCapture" aria-label="Schnell erfassen: Frage, Fehler oder Gedanke festhalten" title="Schnell erfassen: Frage, Fehler oder Gedanke festhalten" data-tip="Schnell erfassen: Frage, Fehler oder Gedanke festhalten"><span aria-hidden="true">+</span></button>
      <div class="toc-item" data-view="weak-spots" role="listitem" title="Schwachstellen"><span class="toc-ico" aria-hidden="true">△</span><span class="toc-num">03</span> <span class="toc-lb">Schwach</span><span class="rail-badge" id="railBadgeWeak" data-badge="weak" role="status" title="Anzahl fälliger Wiederholungen" hidden></span></div>
      <div class="toc-item" data-view="exams-global" role="listitem" title="Prüfungen — alle Termine"><span class="toc-ico" aria-hidden="true">◷</span><span class="toc-num">04</span> <span class="toc-lb">Prüfungen</span><span class="rail-badge" id="railBadgeExam" data-badge="exam" role="status" title="Prüfungen in den nächsten 14 Tagen" hidden></span></div>
      <div class="rail-div" aria-hidden="true"></div>
      <button class="rail-more" id="railMore" aria-label="Weitere Bereiche öffnen: Review, Werkzeuge, Prüfungsvorbereitung, Einstellungen" title="Weitere Bereiche: Review, Werkzeuge, Prüfungsvorbereitung, Einstellungen" aria-expanded="false" aria-controls="more-sheet"><span aria-hidden="true">⋯</span><span class="toc-lb">Mehr</span></button>
      <button class="rail-mod" id="railMod" hidden><span class="rail-mod-dot" aria-hidden="true"></span><span class="rail-mod-code"></span></button>
    </nav>
    <div class="sidebar-overflow" id="sidebar-overflow" hidden>
      <button class="overflow-toggle" type="button" aria-label="Weitere allgemeine Ansichten">Mehr <span>▾</span></button>
      <div class="overflow-menu" id="overflow-menu"></div>
    </div>

    <div class="toc-label mod-label">Module</div>
    <div id="nav-modules"></div>

    <div class="sidebar-footer">
      <button class="cmd-trigger" id="cmd-trigger" aria-label="Befehlspalette öffnen">
        <span>Befehl ausführen</span>
        <kbd id="kbd-hint">⌘K</kbd>
      </button>
    </div>
  </aside>

  <div id="workspace-panel" hidden></div>

  <main class="main" id="main" role="main" tabindex="-1">
    <div class="page" id="view-root"></div>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Hauptbereiche">
    <button class="tab" data-route="today" aria-current="false"><span class="tab-ico" aria-hidden="true">◉</span><span class="tab-lb">Heute</span></button>
    <button class="tab" data-route="overview" aria-current="false"><span class="tab-ico" aria-hidden="true">▦</span><span class="tab-lb">Module</span></button>
    <button class="tab fab" id="tabCapture" aria-label="Schnell erfassen: Frage, Fehler oder Gedanke festhalten" title="Schnell erfassen"><span class="tab-fab-plus" aria-hidden="true">+</span></button>
    <button class="tab" data-route="weak-spots" aria-current="false"><span class="tab-ico" aria-hidden="true">△</span><span class="tab-lb">Schwach</span><span class="tab-badge" id="badgeWeak" data-badge="weak" role="status" title="Anzahl fälliger Wiederholungen" hidden></span></button>
    <button class="tab" data-route="exams-global" aria-current="false"><span class="tab-ico" aria-hidden="true">◷</span><span class="tab-lb">Prüfungen</span><span class="tab-badge" id="badgeExam" data-badge="exam" role="status" title="Prüfungen in den nächsten 14 Tagen" hidden></span></button>
  </nav>

  <div class="sheet-overlay" id="more-overlay" aria-hidden="true">
    <div class="sheet" id="more-sheet" role="dialog" aria-modal="true" aria-labelledby="more-title">
      <div class="sheet-handle" aria-hidden="true"></div>
      <h2 class="sheet-title" id="more-title">Weitere Bereiche</h2>
      <div class="sheet-list">
        <button class="sheet-item" data-route="weekly-review"><span aria-hidden="true">✎</span> Review</button>
        <button class="sheet-item" data-route="tools"><span aria-hidden="true">⚒</span> Werkzeuge</button>
        <button class="sheet-item" data-route="exam-prep"><span aria-hidden="true">⧉</span> Prüfungsvorbereitung</button>
        <button class="sheet-item" data-route="mock-exam"><span aria-hidden="true">⏱</span> Mock-Prüfung</button>
        <button class="sheet-item" data-route="captures"><span aria-hidden="true">⚡</span> Alle Erfassungen</button>
        <button class="sheet-item" data-route="settings"><span aria-hidden="true">⚙</span> Einstellungen</button>
      </div>
      <button class="btn ghost sheet-close" id="more-close">Schließen</button>
    </div>
  </div>
</div>

<nav id="dock" aria-label="Hauptnavigation" hidden>
  <button data-route="today" aria-current="false" aria-label="Heute"><span aria-hidden="true">◉</span></button>
  <button data-route="overview" aria-current="false" aria-label="Module"><span aria-hidden="true">▦</span></button>
  <button id="dockCapture" aria-label="Schnell erfassen: Frage, Fehler oder Gedanke festhalten" title="Schnell erfassen">+</button>
  <button data-route="weak-spots" aria-current="false" aria-label="Schwachstellen"><span aria-hidden="true">△</span><span class="tb-badge" data-badge="weak" role="status" hidden></span></button>
  <button data-route="exams-global" aria-current="false" aria-label="Prüfungen"><span aria-hidden="true">◷</span><span class="tb-badge" data-badge="exam" role="status" hidden></span></button>
  <button id="dockMore" aria-label="Weitere Bereiche öffnen" aria-expanded="false" aria-controls="more-sheet">⋯</button>
</nav>

<!-- Modal Overlay -->
<div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modal-title">
  <div class="modal" id="modal" role="document">
    <div class="modal-header">
      <h2 class="modal-title" id="modal-title">Titel</h2>
      <button class="modal-close" id="modal-close" aria-label="Schließen">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- Command Palette -->
<div class="palette-overlay" id="palette-overlay" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Befehlspalette">
  <div class="palette" role="document">
    <input class="palette-input" id="palette-input" type="search" enterkeyhint="go" placeholder="Springe zu… oder führe aus…" autocomplete="off" aria-label="Befehlsuche" aria-controls="palette-list" aria-expanded="false">
    <div class="palette-list" id="palette-list" role="listbox"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toast-message"></span>
  <button class="btn ghost" id="toast-undo" style="display:none">Rückgängig</button>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
