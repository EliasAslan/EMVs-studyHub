name: Seelen widget build

on:
  push:
    paths:
      - "desktop/Seelen-StudyHub/**"
      - ".github/workflows/seelen-widget-build.yml"
  pull_request:
    paths:
      - "desktop/Seelen-StudyHub/**"
      - ".github/workflows/seelen-widget-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/Seelen-StudyHub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/Seelen-StudyHub/package-lock.json
      - run: npm ci
      - run: npm run build
