<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EMVS Study Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f3ea;
    --paper: #fdfaf3;
    --ink: #1c1917;
    --ink-2: #57534e;
    --ink-3: #a8a29e;
    --rule: #e5dfd2;
    --rule-2: #d1c8b5;

    --accent: #b45309;
    --accent-ink: #7c2d12;
    --accent-soft: #fbe9d0;

    --green: #15803d;
    --green-soft: #ecf6ee;
    --red: #b91c1c;
    --red-soft: #fbeaea;
    --blue: #1e40af;
    --blue-soft: #e8ecf7;

    --serif: "Instrument Serif", ui-serif, Georgia, "Times New Roman", serif;
    --sans: "Inter", ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  [data-theme="dark"] {
    --bg: #17130d;
    --paper: #1c1710;
    --ink: #f5ede0;
    --ink-2: #b8a892;
    --ink-3: #6b5e4b;
    --rule: #2c2519;
    --rule-2: #43392a;
    --accent: #f0a04b;
    --accent-ink: #fcd34d;
    --accent-soft: #3a2a0e;
    --green: #6ee7a8;
    --green-soft: #122a1a;
    --red: #f78a8a;
    --red-soft: #2a1212;
    --blue: #93b4f0;
    --blue-soft: #101a2e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea, select { font-family: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }

  .app { display: flex; height: 100vh; position: relative; }

  /* ============ MOBILE HEADER ============ */
  .mobile-header {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 56px;
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
    z-index: 50;
    align-items: center;
    padding: 0 20px;
    justify-content: space-between;
  }
  .mobile-brand { font-family: var(--serif); font-size: 20px; color: var(--ink); }
  .menu-btn { font-size: 20px; color: var(--ink-2); padding: 8px; }
  .sidebar-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(28, 25, 23, 0.4);
    backdrop-filter: blur(4px);
    z-index: 90;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .sidebar-overlay.open { display: block; opacity: 1; }

  /* ============ SIDEBAR ============ */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    padding: 28px 22px 22px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--rule);
    overflow-y: auto;
    background: var(--bg);
    z-index: 100;
    transition: transform 0.25s ease;
  }

  .brand { display: flex; align-items: baseline; gap: 8px; margin-bottom: 32px; }
  .brand-mark { font-family: var(--serif); font-size: 26px; letter-spacing: -0.01em; color: var(--ink); line-height: 1; }
  .brand-sub { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }

  .toc-label { font-family: var(--mono); font-size: 10px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); margin: 24px 0 10px; }
  .toc-label:first-of-type { margin-top: 0; }

  .toc { display: flex; flex-direction: column; gap: 2px; }
  .toc-item {
    display: flex; align-items: baseline; gap: 10px; padding: 6px 8px;
    border-radius: 4px; font-size: 14px; color: var(--ink-2); cursor: pointer;
    transition: color 0.12s, background 0.12s; user-select: none;
  }
  .toc-item:hover { color: var(--ink); background: var(--rule); }
  .toc-item.active { color: var(--ink); font-weight: 500; background: var(--paper); }
  .toc-item.active .toc-num { color: var(--accent); }
  .toc-num { font-family: var(--mono); font-size: 11px; color: var(--ink-3); min-width: 18px; }

  .chapter { margin-top: 12px; }
  .chapter-header {
    display: flex; align-items: baseline; gap: 10px; padding: 6px 8px;
    border-radius: 4px; cursor: pointer; user-select: none; transition: background 0.12s;
  }
  .chapter-header:hover { background: var(--rule); }
  .chapter-num { font-family: var(--mono); font-size: 11px; color: var(--ink-3); min-width: 18px; }
  .chapter-title { font-family: var(--serif); font-size: 18px; line-height: 1.15; color: var(--ink); letter-spacing: -0.005em; }
  .chapter-sub { font-size: 12px; color: var(--ink-3); margin-left: 28px; margin-bottom: 4px; line-height: 1.35; }
  .chapter-nav { display: none; flex-direction: column; gap: 1px; padding-left: 28px; margin: 4px 0 8px; }
  .chapter.expanded .chapter-nav { display: flex; }
  .chapter-nav .toc-item { font-size: 13px; padding: 4px 8px; }
  .chapter-nav .toc-num { display: none; }
  .chapter-header.active .chapter-title { color: var(--accent-ink); }

  .sidebar-footer { margin-top: auto; padding-top: 20px; border-top: 1px solid var(--rule); }
  .cmd-trigger {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; border-radius: 4px; font-size: 13px; color: var(--ink-2);
    background: var(--paper); border: 1px solid var(--rule); transition: all 0.12s;
  }
  .cmd-trigger:hover { border-color: var(--rule-2); color: var(--ink); }
  kbd {
    font-family: var(--mono); font-size: 10.5px; padding: 2px 6px; border-radius: 3px;
    background: var(--bg); border: 1px solid var(--rule); color: var(--ink-3);
  }

  /* ============ MAIN ============ */
  .main { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  .page {
    max-width: 760px; margin: 0 auto; padding: 64px 56px 120px;
    animation: fadeIn 0.25s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .eyebrow { font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 12px; }
  .page-title { font-family: var(--serif); font-size: 48px; line-height: 1.05; letter-spacing: -0.01em; color: var(--ink); margin-bottom: 8px; font-weight: 400; }
  .page-title em { font-style: italic; }
  .page-lede { font-size: 15px; color: var(--ink-2); margin-bottom: 40px; max-width: 55ch; }

  .rule { border: none; border-top: 1px solid var(--rule); margin: 32px 0; }
  .section-label { font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 16px; }

  /* ============ HERO COUNTDOWN ============ */
  .hero { padding: 8px 0 32px; }
  .hero-count { font-family: var(--serif); font-size: 140px; line-height: 0.85; letter-spacing: -0.03em; color: var(--ink); font-weight: 400; font-variant-numeric: lining-nums; }
  .hero-count small { font-size: 40px; color: var(--ink-2); margin-left: 8px; font-family: var(--serif); }
  .hero-caption { font-size: 15px; color: var(--ink-2); margin-top: 12px; max-width: 48ch; }
  .hero-meta { font-family: var(--mono); font-size: 12px; color: var(--ink-3); margin-top: 6px; }

  /* ============ UP NEXT ============ */
  .up-next { padding: 20px 0 20px 20px; border-left: 2px solid var(--accent); margin-bottom: 8px; }
  .up-next-label { font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent-ink); margin-bottom: 8px; }
  .up-next-text { font-family: var(--serif); font-size: 24px; line-height: 1.25; color: var(--ink); letter-spacing: -0.005em; }
  .up-next-meta { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); margin-top: 8px; }

  /* ============ PROGRESS LINES ============ */
  .stat-list { display: flex; flex-direction: column; gap: 14px; }
  .stat-row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--rule); }
  .stat-row:last-child { border-bottom: none; padding-bottom: 0; }
  .stat-label { font-size: 14px; color: var(--ink-2); }
  .stat-value { font-family: var(--mono); font-size: 13px; color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
  .stat-value .muted { color: var(--ink-3); }

  /* ============ LINKS ============ */
  .link-list { display: flex; flex-direction: column; }
  .link-row {
    display: grid; grid-template-columns: 28px 1fr auto; align-items: baseline; gap: 12px;
    padding: 12px 8px; border-radius: 4px; cursor: pointer; transition: background 0.15s;
  }
  .link-row:hover { background: var(--paper); }
  .link-num { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  .link-row:hover .link-num { color: var(--accent); }
  .link-label { font-size: 14.5px; color: var(--ink); }
  .link-hint { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }

  /* ============ CURRICULUM ============ */
  .hz-list { display: flex; flex-direction: column; }
  .hz-item { padding: 20px 8px; border-radius: 4px; transition: background 0.15s; }
  .hz-item:hover { background: var(--paper); }
  .hz-head { display: grid; grid-template-columns: 44px 1fr auto; gap: 16px; align-items: baseline; cursor: pointer; }
  .hz-num { font-family: var(--serif); font-size: 26px; line-height: 1; color: var(--ink-3); font-style: italic; }
  .hz-item.wip .hz-num { color: var(--accent); }
  .hz-item.done .hz-num { color: var(--green); }
  .hz-title { font-size: 15px; color: var(--ink); line-height: 1.5; }
  .hz-meta { display: flex; gap: 16px; align-items: center; justify-content: flex-end; }
  .hz-conf { display: flex; gap: 4px; align-items: center; }
  .hz-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--rule-2); cursor: pointer; transition: transform 0.1s, background 0.1s; }
  .hz-dot:hover { transform: scale(1.5); }
  .hz-dot.on { background: var(--ink); }
  .hz-item.done .hz-dot.on { background: var(--green); }
  .hz-status {
    font-family: var(--mono); font-size: 11px; padding: 4px 8px; border-radius: 99px;
    background: var(--bg); border: 1px solid var(--rule); color: var(--ink-3);
    cursor: pointer; text-transform: lowercase; letter-spacing: 0.02em; outline: none;
  }
  .hz-status:hover { border-color: var(--rule-2); color: var(--ink); }

  .hz-notes { display: none; margin-top: 14px; padding-left: 60px; }
  .hz-item.open .hz-notes { display: block; }
  .hz-notes textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--rule); border-radius: 4px;
    padding: 12px 14px; font-size: 13.5px; line-height: 1.6; color: var(--ink);
    resize: vertical; min-height: 70px; outline: none; font-family: var(--sans);
  }
  .hz-notes textarea:focus { border-color: var(--accent); }

  /* ============ RESOURCES ============ */
  .res-list { display: flex; flex-direction: column; }
  .res-item {
    display: grid; grid-template-columns: 52px 1fr auto auto; gap: 20px; align-items: baseline;
    padding: 18px 8px; border-radius: 4px; transition: background 0.15s;
  }
  .res-item:hover { background: var(--paper); }
  .res-focus { font-family: var(--serif); font-size: 30px; line-height: 1; letter-spacing: -0.02em; color: var(--ink-3); font-style: italic; }
  .res-focus.high { color: var(--blue); }
  .res-focus.advanced { color: var(--accent); }
  .res-name { font-size: 15px; color: var(--ink); line-height: 1.45; }
  .res-type { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.02em; }
  .res-status {
    font-family: var(--mono); font-size: 11px; padding: 4px 8px; border-radius: 99px;
    background: var(--bg); border: 1px solid var(--rule); color: var(--ink-3);
    cursor: pointer; text-transform: lowercase; outline: none; text-align: right;
  }
  .res-status.done { color: var(--green); border-color: var(--green); background: var(--green-soft); }
  .res-status.wip { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .res-status:hover { border-color: var(--rule-2); color: var(--ink); }

  /* ============ EXAMS ============ */
  .exam-list { display: flex; flex-direction: column; }
  .exam-item { display: grid; grid-template-columns: 1fr auto; gap: 20px; padding: 22px 8px; border-radius: 4px; align-items: baseline; transition: background 0.15s; }
  .exam-item:hover { background: var(--paper); }
  .exam-main { display: flex; flex-direction: column; gap: 6px; }
  .exam-name { font-family: var(--serif); font-size: 22px; line-height: 1.2; color: var(--ink); letter-spacing: -0.005em; }
  .exam-meta { display: flex; gap: 20px; align-items: baseline; font-family: var(--mono); font-size: 12px; color: var(--ink-3); flex-wrap: wrap; }
  .exam-input {
    background: transparent; border: none; border-bottom: 1px dashed var(--rule-2);
    padding: 2px 4px; font-family: var(--mono); font-size: 12px; color: var(--ink);
    outline: none; width: 46px; text-align: center; font-variant-numeric: tabular-nums;
  }
  .exam-input:focus { border-bottom-color: var(--accent); border-bottom-style: solid; }
  .exam-input.wide { width: 110px; text-align: left; }
  .exam-grade { font-family: var(--serif); font-size: 40px; line-height: 1; color: var(--ink-3); font-variant-numeric: lining-nums; letter-spacing: -0.02em; text-align: right; }
  .exam-grade.pass { color: var(--green); }
  .exam-grade.fail { color: var(--red); }

  .projection { padding: 24px 0; font-size: 15px; color: var(--ink-2); line-height: 1.55; max-width: 60ch; }
  .projection strong { color: var(--ink); font-weight: 500; }
  .projection .mono-strong { font-family: var(--mono); color: var(--accent-ink); font-weight: 500; }

  /* ============ STUDY PLAN ============ */
  .week { padding: 28px 0; border-bottom: 1px solid var(--rule); }
  .week:last-child { border-bottom: none; }
  .week-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
  .week-title { font-family: var(--serif); font-size: 22px; line-height: 1.2; color: var(--ink); letter-spacing: -0.005em; }
  .week-badge { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.02em; }
  .week-badge.done { color: var(--green); }
  
  /* Custom Checkbox */
  .week-check {
    display: flex; align-items: flex-start; gap: 14px; padding: 9px 8px; border-radius: 4px;
    cursor: pointer; font-size: 14px; color: var(--ink-2); line-height: 1.55; transition: background 0.12s;
  }
  .week-check:hover { background: var(--paper); }
  .week-check.done { color: var(--ink-3); text-decoration: line-through; }
  .custom-check {
    width: 16px; height: 16px; border: 1.5px solid var(--rule-2); border-radius: 3px;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    transition: all 0.15s; flex-shrink: 0; margin-top: 3px; background: var(--bg);
  }
  .custom-check.checked { background: var(--accent); border-color: var(--accent); }
  .custom-check.checked::after { content: "✓"; color: white; font-size: 11px; font-weight: 700; font-family: var(--sans); }

  /* ============ OVERVIEW ============ */
  .ov-list { display: flex; flex-direction: column; }
  .ov-item { padding: 28px 8px; border-radius: 4px; cursor: pointer; transition: background 0.15s, padding-left 0.15s; }
  .ov-item:hover { background: var(--paper); padding-left: 16px; }
  .ov-head { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin-bottom: 10px; }
  .ov-code { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.14em; text-transform: uppercase; }
  .ov-countdown { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.02em; }
  .ov-title { font-family: var(--serif); font-size: 28px; line-height: 1.15; color: var(--ink); letter-spacing: -0.01em; }
  .ov-next { margin-top: 10px; font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }
  .ov-next-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin-right: 8px; }

  /* ============ TOOLS / SETTINGS ============ */
  .tool-group { margin-bottom: 32px; }
  .field-row { margin-bottom: 20px; }
  .field-row label { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
  .field-row input, .field-row select {
    background: var(--paper); border: 1px solid var(--rule); border-radius: 4px;
    padding: 8px 12px; font-size: 14px; outline: none; width: 200px;
  }
  .field-row input:focus, .field-row select:focus { border-color: var(--ink-3); }
  .btn-row { display: flex; gap: 12px; margin-top: 24px; }
  .btn {
    padding: 8px 16px; font-size: 13px; color: var(--ink-2); border: 1px solid var(--rule);
    border-radius: 4px; transition: all 0.12s; background: var(--paper);
  }
  .btn:hover { color: var(--ink); border-color: var(--ink); }
  .btn.danger:hover { color: var(--red); border-color: var(--red); background: var(--red-soft); }

  /* ============ COMMAND PALETTE ============ */
  .palette-overlay {
    position: fixed; inset: 0; background: rgba(28, 25, 23, 0.35); backdrop-filter: blur(6px);
    display: none; align-items: flex-start; justify-content: center; padding-top: 18vh; z-index: 100;
  }
  .palette-overlay.open { display: flex; }
  .palette {
    width: 100%; max-width: 520px; background: var(--paper); border: 1px solid var(--rule-2);
    border-radius: 6px; box-shadow: 0 32px 80px rgba(28, 25, 23, 0.28); overflow: hidden;
    animation: palette-in 0.14s ease-out;
  }
  @keyframes palette-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  .palette-input {
    width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--rule);
    padding: 18px 22px; font-family: var(--serif); font-size: 20px; color: var(--ink);
    outline: none; letter-spacing: -0.005em;
  }
  .palette-input::placeholder { color: var(--ink-3); font-style: italic; }
  .palette-list { max-height: 380px; overflow-y: auto; padding: 8px 0; }
  .palette-item {
    display: flex; align-items: baseline; gap: 14px; padding: 10px 22px; cursor: pointer;
    font-size: 14px; color: var(--ink-2); transition: background 0.08s;
  }
  .palette-item.selected { background: var(--bg); color: var(--ink); }
  .palette-item.selected::before { content: "→"; font-family: var(--mono); color: var(--accent); margin-left: -16px; margin-right: 2px; }
  .palette-item .group { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.1em; margin-left: auto; }
  .palette-empty { padding: 32px; text-align: center; color: var(--ink-3); font-size: 13.5px; font-style: italic; font-family: var(--serif); }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--rule-2); }

  /* Mobile Responsive */
  @media (max-width: 780px) {
    .mobile-header { display: flex; }
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0;
      transform: translateX(-100%);
      box-shadow: 10px 0 40px rgba(0,0,0,0.1);
    }
    .sidebar.open { transform: translateX(0); }
    .main { padding-top: 56px; }
    .page { padding: 32px 24px 80px; }
    .page-title { font-size: 34px; }
    .hero-count { font-size: 96px; }
    .hz-head { grid-template-columns: 32px 1fr; }
    .hz-meta { grid-column: 1 / -1; margin-top: 8px; justify-content: flex-start; }
    .hz-notes { padding-left: 0; margin-top: 12px; }
    .res-item { grid-template-columns: 1fr; gap: 8px; }
    .res-focus { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="mobile-header">
    <span class="mobile-brand">EMVS</span>
    <button class="menu-btn" id="menuBtn">☰</button each>
  </header>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark">EMVS</span>
      <span class="brand-sub">study hub</span>
    </div>

    <div class="toc-label">Allgemein</div>
    <nav class="toc" id="nav-global">
      <div class="toc-item" data-view="overview"><span class="toc-num">01</span> Übersicht</div>
      <div class="toc-item" data-view="exams-global"><span class="toc-num">02</span> Alle Prüfungen</div>
      <div class="toc-item" data-view="tools"><span class="toc-num">03</span> Werkzeuge</div>

let state = load();
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return seed();
    const parsed = JSON.parse(raw);
    return {
      ...seed(), ...parsed,
      handlungsziele: parsed.handlungsziele || seed().handlungsziele,
      resources: parsed.resources || seed().resources,
      studyPlan: parsed.studyPlan || seed().studyPlan
    };
  } catch { return seed(); }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
}

// ============================================================
// HELPERS
// ============================================================
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const currentModule = () => state.modules.find(m => m.id === state.currentModule) || state.modules[0];

function grade(score, max) {
  const s = parseFloat(score), m = parseFloat(max);
  if (isNaN(s) || isNaN(m) || m <= 0) return null;
  return 1 + 5 * (s / m);
}
function daysUntil(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return Math.ceil((d - today) / 86400000);
}
function countdownParts(dateStr) {
  if (!dateStr) return null;
  const target = new Date(dateStr + 'T08:00:00');
  const now = new Date();
  const diff = target - now;
  if (diff <= 0) return { d: 0, h: 0, m: 0, past: true };
  return {
    d: Math.floor(diff / 86400000),
    h: Math.floor((diff % 86400000) / 3600000),
    m: Math.floor((diff % 3600000) / 60000),
    past: false
  };
}
function nextExam(moduleId) {
  return state.exams
    .filter(e => e.moduleId === moduleId && e.date && grade(e.score, e.max) === null)
    .sort((a, b) => a.date.localeCompare(b.date))[0] || null;
}
function weakestHZ(moduleId) {
  const list = state.handlungsziele.filter(h => h.moduleId === moduleId && h.status !== 'done');
  if (!list.length) return null;
  return list.sort((a, b) => a.confidence - b.confidence)[0];
}
function projectFinal(moduleId, targetGrade) {
  const exams = state.exams.filter(e => e.moduleId === moduleId);
  const totalWeight = exams.reduce((s, e) => s + (+e.weight || 0), 0);
  const done = exams.filter(e => grade(e.score, e.max) !== null);
  const remaining = exams.filter(e => grade(e.score, e.max) === null && +e.weight > 0);
  const remWeight = remaining.reduce((s, e) => s + (+e.weight || 0), 0);
  if (!totalWeight || !remWeight) return null;
  const earned = done.reduce((s, e) => s + grade(e.score, e.max) * (+e.weight || 0), 0);
  const needed = (targetGrade * totalWeight - earned) / remWeight;
  return { needed, remainingWeight: remWeight, reachable: needed <= 6 && needed >= 1 };
}
const ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];

// ============================================================
// ROUTER & MOBILE NAV
// ============================================================
const VIEWS = {
  'overview': renderOverview,
  'exams-global': renderExamsGlobal,
  'tools': renderTools,
  'settings': renderSettings,
  'module-home': renderModuleHome,
  'module-curriculum': renderCurriculum,
  'module-resources': renderResources,
  'module-exams': renderModuleExams,
  'module-practice': renderPractice,
};
let currentView = 'overview';

function navigate(view) {
  currentView = view;
  render();
  closeMobileMenu();
}

function closeMobileMenu() {
  $('#sidebar').classList.remove('open');
  $('#sidebarOverlay').classList.remove('open');
}

$('#menuBtn').addEventListener('click', () => {
  $('#sidebar').classList.add('open');
  $('#sidebarOverlay').classList.add('open');
});
$('#sidebarOverlay').addEventListener('click', closeMobileMenu);

function render() {
  $$('.toc-item').forEach(n => n.classList.toggle('active', n.dataset.view === currentView));
  $$('.chapter').forEach(g => {
    const isCurrent = g.dataset.module === state.currentModule;
    g.classList.toggle('expanded', isCurrent);
    $$('.chapter-header', g).forEach(h => h.classList.toggle('active', isCurrent));
  });
  const fn = VIEWS[currentView] || renderOverview;
  $('#view-root').innerHTML = '';
  $('#view-root').appendChild(fn());
}

function renderOverview() {
  const el = document.createElement('div');
  const items = state.modules.map(m => {
    const exam = nextExam(m.id);
    const cd = exam ? daysUntil(exam.date) : null;
    const weak = weakestHZ(m.id);
    const nextText = weak ? `${weak.title}` : 'Alle Handlungsziele gemeistert';
    return `
      <div class="ov-item" data-module="${m.id}">
        <div class="ov-head">
          <span class="ov-code">Kapitel · Modul ${esc(m.code)}</span>
          <span class="ov-countdown">${cd !== null ? `${cd} Tage bis Prüfung` : 'Keine Prüfung eingetragen'}</span>
        </div>
        <div class="ov-title">${esc(m.title)}</div>
        <div class="ov-next">
          <span class="ov-next-label">Up next</span>${esc(nextText.slice(0, 100))}${nextText.length > 100 ? '…' : ''}
        </div>
      </div>
    `;
  }).join('');

  el.innerHTML = `
    <div class="eyebrow">Übersicht</div>
    <h1 class="page-title">Dein Studium,<br><em>auf einen Blick.</em></h1>
    <p class="page-lede">Alle laufenden Module. Ein Klick bringt dich ins Kapitel.</p>
    <div class="ov-list">${items}</div>
  `;

  el.querySelectorAll('.ov-item').forEach(r => {
    r.addEventListener('click', () => {
      state.currentModule = r.dataset.module;
      save();
      renderSidebar();
      navigate('module-home');
    });
  });
  return el;
}

function renderModuleHome() {
  const m = currentModule();
  const exam = nextExam(m.id);
  const cd = exam ? countdownParts(exam.date) : null;
  const weak = weakestHZ(m.id);
  const doneHZ = state.handlungsziele.filter(h => h.moduleId === m.id && h.status === 'done').length;
  const totalHZ = state.handlungsziele.filter(h => h.moduleId === m.id).length;
  const resDone = state.resources.filter(r => r.moduleId === m.id && r.status === 'done').length;
  const resTotal = state.resources.filter(r => r.moduleId === m.id).length;

  const el = document.createElement('div');
  const links = [
    { num: '01', label: 'Heft Module 162', target: 'https://www.unormal.org/bfo/current/Inf1-Md162/' },
    { num: '02', label: 'Curriculum', view: 'module-curriculum' },
    { num: '03', label: 'Resources', view: 'module-resources' },

  el.innerHTML = `

        <div class="hero-count" style="color:var(--ink-3);">—</div>

    ` : `
      <div class="up-next">
        <div class="up-next-text">Alle Handlungsziele gemeistert.</div>
        <div class="up-next-meta">Zeit für eine Mock-Prüfung.</div>
      </div>

    <div class="section-label">Fortschritt</div>

      <div class="stat-row">
        <span class="stat-label">Handlungsziele gemeistert</span>
        <span class="stat-value">${doneHZ} <span class="muted">/ ${totalHZ}</span></span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Resources abgeschlossen</span>
        <span class="stat-value">${resDone} <span class="muted">/ ${resTotal}</span></span>
      </div>
    </div>

    <hr class="rule">

    <div class="section-label">Schnellzugriff</div>
    <div class="link-list">
      ${links.map(l => `
        <div class="link-row" ${l.target ? `data-target="${esc(l.target)}"` : `data-view="${l.view}"`}>
          <span class="link-num">${l.num}</span>
          <span class="link-label">${esc(l.label)}</span>
          <span class="link-hint">${l.target ? '↗' : '→'}</span>

  el.querySelectorAll('.link-row').forEach(c => {
    c.addEventListener('click', () => {
      if (c.dataset.view) navigate(c.dataset.view);
      else if (c.dataset.target && c.dataset.target !== '#') window.open(c.dataset.target, '_blank');
    });
  });

  if (cd && !cd.past) {
    const interval = setInterval(() => {
      const target = new Date(exam.date + 'T08:00:00');
      const diff = target - new Date();
      const el2 = document.getElementById('countdown');
      if (!el2) { clearInterval(interval); return; }
      if (diff <= 0) { el2.innerHTML = '0<small></small>'; clearInterval(interval); return; }
      const d = Math.floor(diff / 86400000);
      el2.innerHTML = `${d}<small>${d === 1 ? 'Tag' : 'Tage'}</small>`;
    }, 60000);
  }

  return el;
}

function renderCurriculum() {
  const m = currentModule();
  const items = state.handlungsziele.filter(h => h.moduleId === m.id).sort((a, b) => a.num - b.num);
  const el = document.createElement('div');
  el.innerHTML = `
    <div class="eyebrow">Curriculum · Modul ${esc(m.code)}</div>
    <h1 class="page-title">Handlungsziele</h1>
    <p class="page-lede">${items.length} Lernziele aus dem offiziellen Rahmenlehrplan. Klick auf eine Zeile für Notizen.</p>
    <div class="hz-list">
      ${items.map(h => `
        <div class="hz-item ${h.status} ${h.status === 'done' ? 'open' : ''}" data-id="${h.id}">
          <div class="hz-head">
            <div class="hz-num">${ROMAN[h.num - 1] || h.num}</div>
            <div class="hz-title">${esc(h.title)}</div>
            <div class="hz-meta">
              <select class="hz-status" data-id="${h.id}">
                <option value="todo" ${h.status === 'todo' ? 'selected' : ''}>todo</option>
                <option value="wip"  ${h.status === 'wip'  ? 'selected' : ''}>in arbeit</option>
                <option value="done" ${h.status === 'done' ? 'selected' : ''}>gemeistert</option>
              </select>
              <div class="hz-conf" data-id="${h.id}">
                ${[1,2,3,4,5].map(n => `<div class="hz-dot ${n <= h.confidence ? 'on' : ''}" data-n="${n}"></div>`).join('')}
              </div>
            </div>
          </div>
          <div class="hz-notes">
            <textarea data-id="${h.id}" placeholder="Notizen, Pitfalls, Definitionen…">${esc(h.notes || '')}</textarea>
          </div>
        </div>
      `).join('')}
    </div>
  `;

  el.querySelectorAll('.hz-item').forEach(item => {
    item.querySelector('.hz-head').addEventListener('click', e => {
      if (e.target.closest('select') || e.target.closest('.hz-dot')) return;
      item.classList.toggle('open');
    });
  });
  el.querySelectorAll('.hz-status').forEach(sel => {
    sel.addEventListener('change', e => {
      const h = state.handlungsziele.find(x => x.id === sel.dataset.id);
      h.status = e.target.value;
      if (h.status === 'done' && h.confidence < 4) h.confidence = 5;
      save(); render();
    });
  });
  el.querySelectorAll('.hz-conf').forEach(grp => {
    grp.querySelectorAll('.hz-dot').forEach(dot => {
      dot.addEventListener('click', e => {
        e.stopPropagation();
        const h = state.handlungsziele.find(x => x.id === grp.dataset.id);
        const n = +dot.dataset.n;
        h.confidence = h.confidence === n ? 0 : n;
        save(); render();
      });
    });
  });
  el.querySelectorAll('textarea').forEach(t => {
    t.addEventListener('input', e => {
      const h = state.handlungsziele.find(x => x.id === t.dataset.id);
      h.notes = e.target.value;
      save();
    });
  });
  return el;
}

function renderModuleExams() {
  const m = currentModule();

  const el = document.createElement('div');
  el.innerHTML = `
    <div class="eyebrow">Prüfungen · Modul ${esc(m.code)}</div>

    <div class="exam-list">
      ${exams.map(e => {
        const g = grade(e.score, e.max);
        const cls = g === null ? '' : (g >= 4 ? 'pass' : 'fail');
        return `
          <div class="exam-item" data-id="${e.id}">
            <div class="exam-main">
              <div class="exam-name">${esc(e.name)}</div>
              <div class="exam-meta">
                <span><input class="exam-input wide" type="date" value="${esc(e.date)}" data-field="date" data-id="${e.id}"></span>

                <span>
                  <input class="exam-input" value="${esc(e.score)}" data-field="score" data-id="${e.id}" placeholder="—">
                  <span style="color:var(--ink-3);">/</span>
                  <input class="exam-input" value="${esc(e.max)}" data-field="max" data-id="${e.id}" placeholder="—">
                </span>
              </div>
            </div>
            <div class="exam-grade ${cls}">${g === null ? '—' : g.toFixed(2)}</div>
          </div>
        `;
      }).join('')}
    </div>
    <hr class="rule">
    ${renderProjection(m)}
  `;

  el.querySelectorAll('.exam-input').forEach(inp => {
    inp.addEventListener('input', () => {
      const exam = state.exams.find(x => x.id === inp.dataset.id);
      exam[inp.dataset.field] = inp.value;
      save();
      const row = inp.closest('.exam-item');
      const g = grade(exam.score, exam.max);
      const cell = row.querySelector('.exam-grade');
      cell.className = 'exam-grade ' + (g === null ? '' : (g >= 4 ? 'pass' : 'fail'));
      cell.textContent = g === null ? '—' : g.toFixed(2);
      const proj = el.querySelector('.projection');
      if (proj) proj.outerHTML = renderProjection(m);
    });
  });
  return el;
}

function renderProjection(m) {
  const proj = projectFinal(m.id, m.target ?? 5.0);
  const target = m.target ?? 5.0;
  if (!proj) return `<div class="projection">Noch keine offenen Prüfungen mit Gewichtung.</div>`;
  const n = proj.needed;
  if (!proj.reachable || n > 6) {
    return `<div class="projection">Für Zielnote <span class="mono-strong">${target.toFixed(2)}</span> müsstest du in den verbleibenden <span class="mono-strong">${proj.remainingWeight}%</span> eine <span class="mono-strong">${n.toFixed(2)}</span> erreichen — nicht erreichbar.</div>`;
  }
  if (n < 1) {
    return `<div class="projection">Zielnote <span class="mono-strong">${target.toFixed(2)}</span> ist gesichert.</div>`;
  }
  return `<div class="projection">Für Zielnote <span class="mono-strong">${target.toFixed(2)}</span> brauchst du mindestens <span class="mono-strong">${n.toFixed(2)}</span> in den verbleibenden <span class="mono-strong">${proj.remainingWeight}%</span>.</div>`;
}

function renderPractice() {
  const m = currentModule();
  const plan = state.studyPlan[m.id] || {};
  const el = document.createElement('div');

  el.innerHTML = `
    <div class="eyebrow">Study Plan · Modul ${esc(m.code)}</div>
    <h1 class="page-title">Aktionsplan</h1>
    <p class="page-lede">Fünf Wochen, aufgeteilt nach 70/30-Priorität. Wochen 1–3 sind High-Yield. Wochen 4–5 vertiefen.</p>
    ${Object.entries(plan).map(([week, data]) => {
      const done = data.items.filter(i => i.done).length;
      const total = data.items.length;
      const isDone = done === total;
      return `
        <div class="week">
          <div class="week-header">
            <div class="week-title">${esc(data.title)}</div>
            <div class="week-badge ${isDone ? 'done' : ''}">${data.badge} · ${done}/${total}</div>
          </div>
          ${data.items.map(item => `
            <div class="week-check ${item.done ? 'done' : ''}" data-week="${week}" data-id="${item.id}">
              <div class="custom-check ${item.done ? 'checked' : ''}"></div>
              <span>${esc(item.text)}</span>
            </div>
          `).join('')}
        </div>
      `;
    }).join('')}
  `;
  
  el.querySelectorAll('.week-check').forEach(cb => {
    cb.addEventListener('click', e => {
      const week = cb.dataset.week;
      const id = cb.dataset.id;
      const item = state.studyPlan[m.id][week].items.find(i => i.id === id);
      item.done = !item.done;
      save(); render();
    });
  });
  return el;
}

function renderExamsGlobal() {
  const el = document.createElement('div');
  const all = [];
  state.modules.forEach(m => {
    state.exams.filter(e => e.moduleId === m.id).forEach(e => all.push({ ...e, module: m }));
  });
  all.sort((a, b) => (a.date || 'z').localeCompare(b.date || 'z'));

  el.innerHTML = `
    <div class="eyebrow">Alle Module</div>
    <h1 class="page-title">Prüfungen</h1>
    <p class="page-lede">${all.length} Einträge, chronologisch.</p>
    <div class="exam-list">
      ${all.map(e => {
        const g = grade(e.score, e.max);
        const cls = g === null ? '' : (g >= 4 ? 'pass' : 'fail');
        return `
          <div class="exam-item">
            <div class="exam-main">
              <div class="exam-name">${esc(e.name)}</div>
              <div class="exam-meta">
                <span style="color:${e.module.accent}; font-weight:500;">Modul ${esc(e.module.code)}</span>
                <span>${e.date || '—'}</span>
                <span>${e.weight}%</span>
                ${e.score ? `<span>${esc(e.score)} / ${esc(e.max)}</span>` : `<span>noch offen</span>`}
              </div>
            </div>
            <div class="exam-grade ${cls}">${g === null ? '—' : g.toFixed(2)}</div>
          </div>
        `;
      }).join('')}
    </div>
  `;
  return el;
}

function renderSettings() {
  const m = currentModule();
  const el = document.createElement('div');
  el.innerHTML = `
    <div class="eyebrow">Konfiguration</div>
    <h1 class="page-title">Einstellungen</h1>
    <p class="page-lede">Modul ${esc(m.code)} · ${esc(m.title)}</p>

    <div class="field-row">
      <label>Zielnote</label>
      <input id="set-target" type="number" step="0.1" min="1" max="6" value="${m.target ?? 5.0}">
    </div>

    <div class="field-row">
      <label>Theme</label>
      <select id="set-theme">
        <option value="light" ${state.theme === 'light' ? 'selected' : ''}>Hell</option>
        <option value="dark" ${state.theme === 'dark' ? 'selected' : ''}>Dunkel</option>
      </select>
    </div>

    <hr class="rule">

    <div class="section-label">Daten</div>
    <p style="font-size:13.5px; color:var(--ink-2); max-width:52ch; margin-bottom:8px;">
      Alles wird lokal im Browser gespeichert. Regelmäßig exportieren.
    </p>
    <div class="btn-row">
      <button class="btn" id="btn-export">Backup exportieren</button>
      <button class="btn danger" id="btn-reset">Zurücksetzen</button>
    </div>
  `;
  el.querySelector('#set-target').addEventListener('input', e => {
    m.target = parseFloat(e.target.value) || 5.0;
    save();
  });
  el.querySelector('#set-theme').addEventListener('change', e => {
    state.theme = e.target.value;
    document.documentElement.dataset.theme = state.theme;
    save();
  });
  el.querySelector('#btn-export').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `emvs-hub-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
  });
  el.querySelector('#btn-reset').addEventListener('click', () => {
    if (confirm('Alle Daten zurücksetzen?')) {
      state = seed();
      save();
      document.documentElement.dataset.theme = state.theme;
      renderSidebar();
      navigate('overview');
    }
  });
  return el;
}

function renderSidebar() {
  const container = $('#nav-modules');
  container.innerHTML = state.modules.map((m, i) => `
    <div class="chapter ${m.id === state.currentModule ? 'expanded' : ''}" data-module="${m.id}">
      <div class="chapter-header ${m.id === state.currentModule ? 'active' : ''}">
        <span class="chapter-num">${ROMAN[i] || (i + 1)}</span>
        <span class="chapter-title">Modul ${esc(m.code)}</span>
      </div>
      <div class="chapter-sub">${esc(m.title)}</div>
      <nav class="chapter-nav">
        <div class="toc-item" data-view="module-home">Home</div>
        <div class="toc-item" data-view="module-curriculum">Curriculum</div>
        <div class="toc-item" data-view="module-resources">Resources</div>
        <div class="toc-item" data-view="module-exams">Prüfungen</div>
        <div class="toc-item" data-view="module-practice">Study Plan</div>
      </nav>
    </div>
  `).join('');

  container.querySelectorAll('.chapter-header').forEach(h => {
    h.addEventListener('click', () => {
      const id = h.closest('.chapter').dataset.module;
      if (state.currentModule === id && currentView.startsWith('module-')) return;
      state.currentModule = id;
      save();
      renderSidebar();
      navigate('module-home');
    });
  });
  container.querySelectorAll('.chapter-nav .toc-item').forEach(n => {
    n.addEventListener('click', e => { e.stopPropagation(); navigate(n.dataset.view); });
  });
  $$('#nav-global .toc-item').forEach(n => {
    n.classList.toggle('active', n.dataset.view === currentView);
  });
}

$$('#nav-global .toc-item').forEach(n => {
  n.addEventListener('click', () => navigate(n.dataset.view));
});

// ============================================================
// PALETTE
// ============================================================
const palette = {
  overlay: $('#palette-overlay'), input: $('#palette-input'), list: $('#palette-list'),
  items: [], selected: 0,
  open() { this.overlay.classList.add('open'); this.input.value = ''; this.input.focus(); this.build(''); },
  close() { this.overlay.classList.remove('open'); },
  build(query) {
    const q = query.toLowerCase().trim();
    const cmds = [
      { label: 'Übersicht', group: 'navigation', action: () => navigate('overview') },
      { label: 'Alle Prüfungen', group: 'navigation', action: () => navigate('exams-global') },
      { label: 'Werkzeuge', group: 'navigation', action: () => navigate('tools') },
      { label: 'Einstellungen', group: 'navigation', action: () => navigate('settings') },
    ];
    state.modules.forEach(m => {
      ['Home','Curriculum','Resources','Prüfungen','Study Plan'].forEach(sub => {
        cmds.push({
          label: `Modul ${m.code} · ${sub}`,
          group: 'modul',
          action: () => {
            state.currentModule = m.id; save(); renderSidebar();
            const map = { 'Home': 'module-home', 'Curriculum': 'module-curriculum', 'Resources': 'module-resources', 'Prüfungen': 'module-exams', 'Study Plan': 'module-practice' };
            navigate(map[sub]);
          }
        });
      });
    });
    cmds.push({ label: 'Heft Module 162 öffnen', group: 'link', action: () => window.open('https://www.unormal.org/bfo/current/Inf1-Md162/', '_blank') });
    cmds.push({ label: 'Theme: Hell', group: 'theme', action: () => { state.theme = 'light'; document.documentElement.dataset.theme = 'light'; save(); } });
    cmds.push({ label: 'Theme: Dunkel', group: 'theme', action: () => { state.theme = 'dark'; document.documentElement.dataset.theme = 'dark'; save(); } });

    const filtered = q ? cmds.filter(c => c.label.toLowerCase().includes(q)) : cmds;
    this.items = filtered; this.selected = 0;
    if (!filtered.length) { this.list.innerHTML = `<div class="palette-empty">Keine Treffer.</div>`; return; }
    this.list.innerHTML = filtered.map((c, i) => `
      <div class="palette-item ${i === 0 ? 'selected' : ''}" data-i="${i}">
        <span>${esc(c.label)}</span>
        <span class="group">${esc(c.group)}</span>
      </div>
    `).join('');
    this.list.querySelectorAll('.palette-item').forEach(item => {
      item.addEventListener('click', () => this.execute(+item.dataset.i));
      item.addEventListener('mouseenter', () => this.select(+item.dataset.i));
    });
  },
  select(i) {
    this.selected = i;
    this.list.querySelectorAll('.palette-item').forEach((el, idx) => el.classList.toggle('selected', idx === i));
  },
  execute(i) { const cmd = this.items[i]; if (!cmd) return; this.close(); cmd.action(); },
  move(delta) {
    if (!this.items.length) return;
    const next = (this.selected + delta + this.items.length) % this.items.length;
    this.select(next);
    this.list.querySelector(`[data-i="${next}"]`)?.scrollIntoView({ block: 'nearest' });
  },
};

$('#cmd-trigger').addEventListener('click', () => palette.open());
palette.overlay.addEventListener('click', e => { if (e.target === palette.overlay) palette.close(); });
palette.input.addEventListener('input', e => palette.build(e.target.value));
palette.input.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); palette.move(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); palette.move(-1); }
  else if (e.key === 'Enter') { e.preventDefault(); palette.execute(palette.selected); }
  else if (e.key === 'Escape') { palette.close(); }
});

document.addEventListener('keydown', e => {
  const isMod = e.metaKey || e.ctrlKey;
  if (isMod && e.key.toLowerCase() === 'k') { e.preventDefault(); palette.open(); return; }
  if (e.key === 'Escape' && palette.overlay.classList.contains('open')) { palette.close(); return; }
  if (palette.overlay.classList.contains('open')) return;
  if (!isMod && !e.target.matches('input, textarea, select')) {
    if (e.key === '1') navigate('overview');
    else if (e.key === '2') navigate('exams-global');
    else if (e.key === '3') navigate('tools');
    else if (e.key === '4') navigate('settings');
  }
});

document.documentElement.dataset.theme = state.theme || 'light';
$('#kbd-hint').textContent = navigator.platform.includes('Mac') ? '⌘K' : 'Ctrl+K';
renderSidebar();
navigate('overview');
