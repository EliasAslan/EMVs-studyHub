[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
LeftMouseUpAction=["http://localhost:5173"]
RightMouseUpAction=[!Refresh]

[Metadata]
Name=Study Hub
Author=Study Hub
Version=1.0
Description=Study Hub desktop widget reading the exported study-hub snapshot TXT.

[Variables]
SnapshotFile=C:\Users\e3953\Documents\EMVs-studyHub\desktop\snapshots\study-hub-widget.txt

[MeasureStartHereParent]
Measure=WebParser
URL=file://#SnapshotFile#
RegExp=(?mi)^startTitle=(.*)$
CodePage=65001
UpdateRate=30

[MeasureStartHere]
Measure=WebParser
URL=[MeasureStartHereParent]
StringIndex=1
CodePage=65001
UpdateRate=30
IfMatch=^.+
IfMatchAction=[!SetOption MeterStartHereTitle Text "[MeasureStartHere]"][!UpdateMeter MeterStartHereTitle][!Redraw]
IfNotMatchAction=[!SetOption MeterStartHereTitle Text "Keine offene Aufgabe"][!UpdateMeter MeterStartHereTitle][!Redraw]
IfMatchMode=1

[MeasureOpenCountParent]
Measure=WebParser
URL=file://#SnapshotFile#
RegExp=(?mi)^openCount=(\d+)$
CodePage=65001
UpdateRate=30

[MeasureOpenCount]
Measure=WebParser
URL=[MeasureOpenCountParent]
StringIndex=1
CodePage=65001
UpdateRate=30
IfMatch=^\d+$
IfMatchAction=[!SetOption MeterOpenCount Text "[MeasureOpenCount] offen"][!UpdateMeter MeterOpenCount][!Redraw]
IfNotMatchAction=[!SetOption MeterOpenCount Text "0 offen"][!UpdateMeter MeterOpenCount][!Redraw]
IfMatchMode=1

[MeasureGeneratedAtParent]
Measure=WebParser
URL=file://#SnapshotFile#
RegExp=(?mi)^generatedAt=(\d{4}-\d{2}-\d{2})
CodePage=65001
UpdateRate=30

[MeasureGeneratedAt]
Measure=WebParser
URL=[MeasureGeneratedAtParent]
StringIndex=1
CodePage=65001
UpdateRate=30
IfMatch=^\d{4}-\d{2}-\d{2}
IfMatchAction=[!SetOption MeterUpdated Text "Zuletzt aktualisiert: [MeasureGeneratedAt]"][!UpdateMeter MeterUpdated][!Redraw]
IfNotMatchAction=[!SetOption MeterUpdated Text "Zuletzt aktualisiert: unbekannt"][!UpdateMeter MeterUpdated][!Redraw]
IfMatchMode=1

[MeasureDeadline1TitleParent]
Measure=WebParser
URL=file://#SnapshotFile#
RegExp=(?mi)^deadline1Title=(.*)$
CodePage=65001
UpdateRate=30

[MeasureDeadline1Title]
